<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGlow" x1="20" y1="14" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#shieldGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Shield Shape Outer Glow -->
  <path d="M32 10L49 17.5V31.5C49 42.5 41.5 50.8 32 54C22.5 50.8 15 42.5 15 31.5V17.5L32 10Z" 
        fill="#000000" fill-opacity="0.4" stroke="url(#amberGold)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner Spark / Neural Core -->
  <path d="M32 20L34.5 28.5L43 31L34.5 33.5L32 42L29.5 33.5L21 31L29.5 28.5L32 20Z" 
        fill="url(#amberGold)" filter="url(#subtleGlow)"/>

  <!-- Mini Corner Verification Dot -->
  <circle cx="45" cy="45" r="5.5" fill="#10b981"/>
  <path d="M42.5 45L44.2 46.8L47.5 43.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>